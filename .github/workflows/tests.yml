name: test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python examples/demo.py
      - run: python examples/semantic_demo.py
      - run: python examples/benchmark_sample.py
      - run: python examples/preregistered_research.py generate --output /tmp/aeon-research-corpus.json
      - run: python examples/audit_research_corpus.py --output /tmp/aeon-corpus-integrity.json
  cross-language:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e .
      - run: python examples/generate_semantic_vectors.py
      - run: git diff --exit-code -- fixtures/semantic-vectors.json
      - run: node --test js/*.test.mjs js/test.mjs
      - run: node js/create-ack.mjs < fixtures/python-task.json > /tmp/aeon-node-ack.json
      - run: python examples/check_node_ack.py /tmp/aeon-node-ack.json
      - run: python examples/cross_runtime_security.py
      - run: python examples/generate_canonical_fuzz.py > /tmp/aeon-canonical-fuzz.json
      - run: node js/verify-fuzz.mjs /tmp/aeon-canonical-fuzz.json
      - run: python examples/generate_validation_vectors.py > /tmp/aeon-validation-vectors.json
      - run: node js/verify-validation.mjs /tmp/aeon-validation-vectors.json
      - run: python examples/generate_receipt_vectors.py > /tmp/aeon-receipt-vectors.json
      - run: node js/verify-receipts.mjs /tmp/aeon-receipt-vectors.json
