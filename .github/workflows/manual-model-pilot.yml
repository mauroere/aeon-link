name: Manual paid LLM pilot (opt-in only)
on:
  workflow_dispatch:
    inputs:
      provider:
        description: Model provider (requires corresponding repository secret)
        required: true
        type: choice
        options: [openai, anthropic, gemini]
      model:
        description: Exact model ID enabled on your account
        required: true
        type: string
      limit:
        description: Pilot cases (1-12; three paid calls per case)
        required: true
        type: number
        default: 5
      confirm_paid_calls:
        description: Explicitly authorize paid API requests
        required: true
        type: choice
        options: [no, yes]
        default: no
permissions:
  contents: read
jobs:
  pilot:
    if: ${{ inputs.confirm_paid_calls == 'yes' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Run bounded, read-only synthetic pilot
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PILOT_PROVIDER: ${{ inputs.provider }}
          PILOT_MODEL: ${{ inputs.model }}
          PILOT_LIMIT: ${{ inputs.limit }}
        shell: bash
        run: |
          if ! [[ "$PILOT_LIMIT" =~ ^[0-9]+$ ]] || (( PILOT_LIMIT < 1 || PILOT_LIMIT > 12 )); then
            echo 'Limit must be 1-12 to bound unexpected API costs.' >&2
            exit 1
          fi
          python examples/preregistered_research.py live \
            --provider "$PILOT_PROVIDER" --model "$PILOT_MODEL" \
            --split pilot --limit "$PILOT_LIMIT" \
            --i-accept-api-costs --output aeon-pilot-report.json
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: synthetic-pilot-report
          path: aeon-pilot-report.json
          retention-days: 30
